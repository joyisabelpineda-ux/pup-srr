{% extends 'base.html' %}{% from '_macros.html' import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card center">
  <div class="empty">{{ icon('alert') }}<h1>{{ code }} — {{ title }}</h1><p>{{ message }}</p></div>
  <div class="flex gap-2 wrap items-center center-row">
    {% if current_user %}<a class="btn" href="{{ url_for('auth.index') }}">Go to my dashboard</a>{% else %}<a class="btn" href="{{ url_for('auth.login') }}">Go to login</a>{% endif %}
</div>
</section>
{% endblock %}
