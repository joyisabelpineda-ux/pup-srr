<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUP Smart Room Reservation & IoT Access System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F2F0;--surface:#FFFFFF;--soft:#FCFBFA;--text:#1F1A1A;--muted:#5A5050;--border:#E4DEDB;--input:#B9AEAA;--chip:#F1ECE9;
  --maroon:#7A1620;--maroon-d:#6E0F1B;--gold:#E8B93A;--link:#7A1620;--title:#3A0A10;--sel:#FDF1F2;--gold-soft:#FFF8E1;--gold-ink:#4F0C14;
  --g-bg:#E3F4E8;--g-fg:#14532D;--g:#1E8E3E;--g-halo:#D6EEDD;--g-bd:#9ED3AE;
  --r-bg:#FDE8E8;--r-fg:#8B1A1A;--r:#C62828;--r-halo:#F8D4D4;--r-bd:#EDA9A9;
  --y-bg:#FFF3CD;--y-fg:#6B4E00;--y:#F2B300;--y-halo:#FBE9A8;
  --n-bg:#ECECEC;--n-fg:#3F3F3F;--n:#6B6B6B;--taken:#EFEAE7;--taken-fg:#6B6B6B;--row:#EFEAE7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161012;--surface:#221A1C;--soft:#2A2124;--text:#F2EBEC;--muted:#BBAEB0;--border:#3A2E31;--input:#7A686B;--chip:#2E2528;
    --link:#F0A0AA;--title:#F7E3E5;--sel:#3A1A1F;--gold-soft:#3A2F10;--gold-ink:#F6DFA0;
    --g-bg:#153B24;--g-fg:#9AE6B4;--g-halo:#1C4A2E;--g-bd:#2F7A4A;
    --r-bg:#4A1717;--r-fg:#FFB8B8;--r-halo:#5E2020;--r-bd:#8B3A3A;
    --y-bg:#4A3A0A;--y-fg:#FFE08A;--y-halo:#5C4A10;
    --n-bg:#343034;--n-fg:#E0DADA;--taken:#2E2528;--taken-fg:#A99DA0;--row:#33292C;
  }
}
:root[data-theme="dark"]{
  --bg:#161012;--surface:#221A1C;--soft:#2A2124;--text:#F2EBEC;--muted:#BBAEB0;--border:#3A2E31;--input:#7A686B;--chip:#2E2528;
  --link:#F0A0AA;--title:#F7E3E5;--sel:#3A1A1F;--gold-soft:#3A2F10;--gold-ink:#F6DFA0;
  --g-bg:#153B24;--g-fg:#9AE6B4;--g-halo:#1C4A2E;--g-bd:#2F7A4A;
  --r-bg:#4A1717;--r-fg:#FFB8B8;--r-halo:#5E2020;--r-bd:#8B3A3A;
  --y-bg:#4A3A0A;--y-fg:#FFE08A;--y-halo:#5C4A10;
  --n-bg:#343034;--n-fg:#E0DADA;--taken:#2E2528;--taken-fg:#A99DA0;--row:#33292C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.4}
h1,h2,h3,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],input[type=email],input[type=password],select{height:48px;width:100%;border:1.5px solid var(--input);border-radius:10px;padding:0 14px;font-size:16px;background:var(--surface)}
label{font-size:14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:8px}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.btn{height:52px;border:none;border-radius:10px;background:var(--maroon);color:#fff;font-size:16px;font-weight:700;padding:0 28px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--input);font-size:15px;padding:0 24px}
.btn.gold{background:var(--gold-soft);color:var(--gold-ink);border:2px solid var(--gold);font-size:15px}
.btn:disabled{background:var(--border);color:var(--muted)}
.link{border:none;background:none;padding:0;font-weight:700;color:var(--link);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;font-size:13px;font-weight:700}
.dot{display:inline-block;border-radius:50%}
.G{background:var(--g-bg);color:var(--g-fg)}.R{background:var(--r-bg);color:var(--r-fg)}.Y{background:var(--y-bg);color:var(--y-fg)}.N{background:var(--n-bg);color:var(--n-fg)}
.bgG{background:var(--g)}.bgR{background:var(--r)}.bgY{background:var(--y)}.bgN{background:var(--n)}
.navb{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;border:none;background:none;color:#E9E1E2;font-weight:600;font-size:14px;width:100%;text-align:left}
.navb:hover{background:#3A2A2D}.navb.on{background:var(--maroon);color:#fff;font-weight:700}
.qa{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left}
.qa:hover{border-color:var(--maroon);box-shadow:0 6px 18px rgba(80,20,28,.14)}
.opt{border-radius:12px;border:2px solid var(--input);background:var(--surface)}
.opt.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.opt.sel{background:var(--sel);border-color:var(--maroon)}
.opt:disabled{background:var(--taken);color:var(--taken-fg);border-color:var(--border)}
table{width:100%;border-collapse:collapse;min-width:560px;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:2px solid var(--gold)}
td{padding:14px 12px;border-bottom:1px solid var(--row)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 2s infinite}@keyframes p{50%{opacity:.45}}}
</style>
</head>
<body>
<div id="app"></div>
<script>

};
var LOGO='<svg width="__S__" height="__S__" viewBox="0 0 100 100" role="img" aria-label="PUP star logo"><circle cx="50" cy="50" r="48" fill="#E8B93A"/><circle cx="50" cy="50" r="42" fill="#6E0F1B"/><polygon points="50,14 59,39 86,39 64,55 72,81 50,65 28,81 36,55 14,39 41,39" fill="#E8B93A"/></svg>';
function logo(s){return LOGO.replace(/__S__/g,s);}

var ROOMS=[['101','Lecture Room','40 seats','G','Available','Vacant now'],['102','Computer Lab','30 seats','R','Occupied','In use until 11:00 AM'],['103','Conference Room','12 seats','Y','Reserved','Starts at 1:00 PM'],['104','Study Room','8 seats','G','Available','Vacant now'],['105','Science Lab','24 seats','R','Occupied','In use until 12:30 PM']];

/* ---------- LOGIN ---------- */
function loginScreen(){
 var login=S.tab==='login';
 var tabs='<div role="group" aria-label="Choose Log In or Sign Up" class="row" style="gap:6px;padding:5px;border-radius:12px;background:var(--chip)">'+

  '<button type="button" data-act="tab" data-v="signup" aria-pressed="'+(!login)+'" class="'+(!login?'btn':'')+'" style="flex:1;height:44px;border:none;border-radius:9px;font-size:15px;font-weight:700;padding:0;background:'+(!login?'':'transparent')+'">Sign Up</button></div>';
 var form;
 if(login){

 }else{

  '<div class="field"><label for="sname">Full name</label><input id="sname" type="text" placeholder="e.g. Juan Dela Cruz" autocomplete="name"></div>'+
  '<div class="field"><label for="sid">Student / Employee ID</label><input id="sid" type="text" placeholder="e.g. 2022-00123-MN-0"></div>'+
  '<div class="field"><label for="semail">PUP email</label><input id="semail" type="email" placeholder="name@iskolarngbayan.pup.edu.ph" autocomplete="email"></div>'+
  '<div class="field"><label for="srole">I am a</label><select id="srole"><option>Student</option><option>Faculty</option><option>Staff</option></select></div>'+
  '<div class="field"><label for="spw">Password</label><input id="spw" type="password" placeholder="Create a password" autocomplete="new-password"></div>'+

 }
 var campus='<svg viewBox="0 0 640 230" style="width:100%;max-width:640px;height:auto" role="img" aria-label="Illustration of the PUP campus buildings"><circle cx="540" cy="52" r="30" fill="#E8B93A" opacity=".9"/><rect y="200" width="640" height="30" fill="#4F0C14"/><rect x="60" y="90" width="150" height="110" fill="#8E2432"/><rect x="60" y="80" width="150" height="14" fill="#E8B93A"/><g fill="#F3D98B"><rect x="76" y="108" width="18" height="24"/><rect x="106" y="108" width="18" height="24"/><rect x="136" y="108" width="18" height="24"/><rect x="166" y="108" width="18" height="24"/><rect x="76" y="148" width="18" height="24"/><rect x="106" y="148" width="18" height="24"/><rect x="136" y="148" width="18" height="24"/><rect x="166" y="148" width="18" height="24"/></g><rect x="240" y="40" width="160" height="160" fill="#A12C3C"/><polygon points="230,40 320,6 410,40" fill="#E8B93A"/><g fill="#fff" opacity=".9"><rect x="262" y="62" width="14" height="136"/><rect x="298" y="62" width="14" height="136"/><rect x="334" y="62" width="14" height="136"/><rect x="370" y="62" width="14" height="136"/></g><rect x="296" y="150" width="48" height="50" fill="#4F0C14"/><rect x="430" y="100" width="130" height="100" fill="#8E2432"/><rect x="430" y="92" width="130" height="12" fill="#E8B93A"/><g fill="#F3D98B"><rect x="446" y="118" width="18" height="22"/><rect x="476" y="118" width="18" height="22"/><rect x="506" y="118" width="18" height="22"/><rect x="446" y="156" width="18" height="22"/><rect x="476" y="156" width="18" height="22"/><rect x="506" y="156" width="18" height="22"/></g><g fill="#4F0C14"><rect x="26" y="150" width="8" height="50"/><rect x="590" y="140" width="8" height="60"/></g><g fill="#2F7D4A"><circle cx="30" cy="140" r="26"/><circle cx="594" cy="128" r="30"/></g></svg>';

/* ---------- DASHBOARD ---------- */
function sidebar(active){
 function n(act,v,icon,label,on){return '<button type="button" class="navb'+(on?' on':'')+'" data-act="'+act+'" data-v="'+v+'"'+(on?' aria-current="page"':'')+'>'+ic(icon)+label+'</button>';}

 '<div class="col" style="gap:28px"><div class="row" style="gap:12px;padding:0 8px">'+logo(40)+'<div><div style="font-weight:800;font-size:16px;color:#fff">PUP SmartRoom</div><div style="font-size:12px;color:#E8B93A">Reservation &amp; IoT Access</div></div></div>'+
 '<nav aria-label="Main" class="col" style="gap:4px">'+n('go','dashboard',I.dash,'Dashboard',true)+n('go','booking',I.cal,'Reserve Room')+n('go','walkin',I.qr,'Scan QR Code')+n('scroll','status',I.home,'Room Status')+n('scroll','mine',I.list,'My Reservations')+n('scroll','logs',I.doc,'Access Logs')+'</nav></div>'+

function dashboard(){
 var metrics=[['2','My Reservations','Active today',I.cal,'#F3E5E7','#7A1620'],['8','Available Rooms','Vacant now',I.chk,'G'],['5','Occupied Rooms','In use / locked',I.lockc,'R'],['3','Reserved Rooms','Upcoming slot',I.clock,'Y']];
 var mh=metrics.map(function(m){
  var cls=m.length===5?m[4]:'',st=m.length>5?'background:'+m[4]+';color:'+m[5]:'';
  return '<div class="card row" style="padding:20px;gap:16px"><div class="row '+cls+'" style="width:52px;height:52px;border-radius:12px;justify-content:center;flex:none;'+st+'">'+ic(m[3]).replace('class="ic"','class="ic" style="width:26px;height:26px"')+'</div><div><div style="font-size:34px;font-weight:800;line-height:1">'+m[0]+'</div><div style="font-size:14px;font-weight:700;margin-top:6px">'+m[1]+'</div><div style="font-size:12px;color:var(--muted);margin-top:2px">'+m[2]+'</div></div></div>';}).join('');
 var rooms=ROOMS.map(function(r){return '<li class="row wrap" style="justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--soft)"><div class="row" style="gap:14px"><span class="dot bg'+r[3]+'" style="width:14px;height:14px;flex:none" aria-hidden="true"></span><div><div style="font-size:16px;font-weight:800">Room '+r[0]+'</div><div style="font-size:13px;color:var(--muted)">'+r[1]+' · '+r[2]+'</div></div></div><div class="col" style="align-items:flex-end;gap:4px"><span class="badge '+r[3]+'">'+r[4]+'</span><span style="font-size:12px;color:var(--muted)">'+r[5]+'</span></div></li>';}).join('');
 function qa(act,v,icon,t,s,bg,fg){return '<button type="button" class="qa" data-act="'+act+'" data-v="'+v+'"><span class="row" style="width:48px;height:48px;border-radius:12px;justify-content:center;background:'+bg+';color:'+fg+'">'+ic(icon).replace('class="ic"','class="ic" style="width:24px;height:24px"')+'</span><span><span style="display:block;font-size:16px;font-weight:800">'+t+'</span><span style="display:block;font-size:13px;color:var(--muted);margin-top:2px">'+s+'</span></span></button>';}
 var res=RES.map(function(x){return '<tr><td style="font-weight:700;white-space:nowrap">'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td><span class="badge '+x[4]+'"><span class="dot bg'+x[4]+'" style="width:8px;height:8px"></span>'+x[3]+'</span></td></tr>';}).join('');

  var a=f(x,y,0,0),b=f(x,y,14,0),c=f(x,y,0,14),fp=a!==null?a:(b!==null?b:c),on;
